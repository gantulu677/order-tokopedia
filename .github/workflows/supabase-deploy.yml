name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/tokopedia-admin/**'
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-admin-edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        run: npm install --global supabase@2.81.3
      - name: Deploy tokopedia-admin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          supabase functions deploy tokopedia-admin --project-ref bkyqbbigfvfaobblxziu --no-verify-jwt

  deploy-database-migrations:
    if: ${{ vars.SUPABASE_MIGRATIONS_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        run: npm install --global supabase@2.81.3
      - name: Link project and apply repository migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD secret"; exit 1; }
          supabase link --project-ref bkyqbbigfvfaobblxziu --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
