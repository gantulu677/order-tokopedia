<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Redirecting…</title></head>
<body><script>
(function () {
  var base = '/order-tokopedia';
  var path = window.location.pathname;
  if (path.indexOf(base) === 0) path = path.slice(base.length);
  var redirect = base + (path || '/') + window.location.search + window.location.hash;
  sessionStorage.setItem('gh-pages-redirect', redirect);
  window.location.replace(base + '/');
})();
</script></body>
</html>
